
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  concurrency: 4

linters:
  default: standard
  enable:
    - depguard
    - misspell
    - forbidigo
    - embeddedstructfieldcheck
  settings:
    depguard:
      rules:
        operator-sort:
          files:
            - '**/operator/**/*.go'
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    misspell:
      locale: US
  exclusions:
    paths:
      - '^references/'
    presets:
      - common-false-positives
      - legacy
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
      - linters:
          - forbidigo
        path: main.go

formatters:
  exclusions:
    paths:
      - '^references/'
  enable:
    - gofumpt
    - goimports
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/woxQAQ)
      custom-order: true
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/woxQAQ
    golines:
      max-len: 80
      tab-len: 4
      reformat-tags: true
      chain-split-dots: true
