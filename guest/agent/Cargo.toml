[package]
name = "sandbox-agent"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
filesystem-fixtures = []

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
libc = "0.2"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-vsock = "0.7"
walkdir = "2"

[build-dependencies]
prost-build = "0.14"
