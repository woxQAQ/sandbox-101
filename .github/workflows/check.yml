name: check
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            engine/go.sum
            sandboxd/go.sum
            protocol/gen/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: python3 -I scripts/test_acceptance_environment.py
      - run: GOWORK=off go -C engine test -tags=kvm ./... -run '^TestAcceptanceRootfsOCI$' -count=1
      - run: make test check test-race integration smoke
  static-guest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools cpio ripgrep
      - run: make guest
